name: Check the download page
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platforms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Installer and whole-page motion contracts
        run: npm test
      - name: Commercial page regressions
        run: npm run test:commercial
      - name: Preserve review screenshots and exact tested website
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-site-review
          retention-days: 3
          path: |
            artifacts/
            index.html
            home.css
            home.js
            media/
            docs/launch-motion-and-claims.md
