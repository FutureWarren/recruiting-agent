name: Check the download page
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platforms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Installer, mobile first-paint and desktop isolation contracts
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm test 2>&1 | tee artifacts/test-results.log
      - name: Commercial page regressions
        run: npm run test:commercial
      # Live verification runs only after the Pages deployment has completed.
      # An independent push job races the deploy and falsely flags stale CDN content.
      - name: Preserve review screenshots and exact tested website
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-site-review
          retention-days: 3
          path: |
            artifacts/
            index.html
            home.css
            home.js
            mobile.css
            mobile.js
            media/
            docs/launch-motion-and-claims.md
