name: Verify live HD landing revision
on:
  push:
    branches: [verify/live-hd-c1b1414]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check deployed files, HD playback and real download click
        run: node test/hd-live-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit-hd-live-verification
          retention-days: 3
          path: production-verification/
