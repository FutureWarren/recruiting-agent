name: Deploy site

# Publishes this repo to GitHub Pages — the download page students are sent to.
# It reads the latest release from this repo's public API at view time, so a
# new app version needs no redeploy here.
#
# ONE-TIME SETUP: Settings → Pages → Build and deployment → Source =
# "GitHub Actions". Until that is done every run fails at configure-pages with
# "Get Pages site failed"; it cannot be automated, because the Actions token is
# not allowed to create the Pages site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # The site is the repo root; releases are attached to Releases, not
          # committed, so there is nothing to exclude.
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
