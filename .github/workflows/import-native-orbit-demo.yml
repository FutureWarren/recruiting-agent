name: Import Orbit website video to self-hosted media
on:
  push:
    branches: [fix/native-loop-orbit-demo-20261108]
    paths: [.github/workflows/import-native-orbit-demo.yml]
permissions:
  contents: write
jobs:
  create-static-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved video and make web-optimized version
        env:
          VIDEO_SOURCE: "https://media.descriptusercontent.com/v3/proxy/remux?url=https%3A%2F%2Fapi.descript.com%2Fv2%2Fpublished_projects%2F7841cf5d-0eb3-41ad-acca-ee3b3d5d2399%2Fhls%3Fexpiration%3D1794276783439%26signature%3D429a335a60f9cec7931e5457c145a7a5724070247c220949f203fe09cf4c7980&filename=Orbit+Website+Demo+19.5s+Final+Candidate.mp4&mediaCacheBucketName=production-273614-media-cache&expiration=1794273183&signature=cb0835dddb708f639ba436c176a887c01258862cc3c4c5755e5868e117143c4f"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media
          curl --fail --location --silent --show-error --retry 3 --max-time 180 "$VIDEO_SOURCE" -o /tmp/orbit-video-source.mp4
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          test -s /tmp/orbit-video-source.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 /tmp/orbit-video-source.mp4
          duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/orbit-video-source.mp4)
          python3 -c 'import sys; d=float(sys.argv[1]); assert 18 <= d <= 22, f"unexpected demo length: {d}"' "$duration"
          ffmpeg -y -hide_banner -loglevel error -i /tmp/orbit-video-source.mp4 -map 0:v:0 -vf 'scale=1280:720' -r 30 -c:v libx264 -crf 28 -preset medium -pix_fmt yuv420p -an -movflags +faststart media/orbit-demo-light-20261108.mp4
          ffmpeg -y -hide_banner -loglevel error -ss 1 -i /tmp/orbit-video-source.mp4 -frames:v 1 -vf 'scale=1280:720' -q:v 4 media/orbit-demo-light-poster.jpg
          test $(stat -c%s media/orbit-demo-light-20261108.mp4) -gt 200000
          test $(stat -c%s media/orbit-demo-light-poster.jpg) -gt 8000
          ffprobe -v error -show_entries format=duration,size -of json media/orbit-demo-light-20261108.mp4
      - name: Commit approved media to this review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/orbit-demo-light-20261108.mp4 media/orbit-demo-light-poster.jpg
          git commit -m 'assets: store approved 20-second Orbit demo locally for native playback'
          git push origin "HEAD:${GITHUB_REF_NAME}"
