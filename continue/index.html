<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f0">
<meta name="robots" content="noindex,nofollow">
<title>Continue with Orbit</title>
<link rel="stylesheet" href="continue.css?v=20260929-1">
</head>
<body>
<main class="handoff-page">
  <a class="brand" href="/" aria-label="Orbit home"><span class="orbit-mark" aria-hidden="true"></span>Orbit</a>
  <section class="handoff-card" id="handoff-card" aria-live="polite">
    <div class="visual" aria-hidden="true">
      <div class="rings"><i></i><i></i><i></i></div>
      <div class="orb"><span class="orbit-ring"></span><span class="satellite"></span><b>Orbit</b></div>
      <div class="beam"></div>
    </div>
    <div class="content">
      <div class="eyebrow" id="eyebrow">Your Orbit handoff</div>
      <h1 id="title">Picking up where you left off.</h1>
      <p class="lede" id="lede">Loading your recruiting goal…</p>
      <div class="receipt" id="receipt" hidden>
        <small>Recruiting for</small>
        <strong id="goal"></strong>
        <span id="detail"></span>
      </div>
      <div class="actions" id="actions" hidden>
        <button class="primary" id="open-orbit" type="button"><span>Open Orbit</span><b>→</b></button>
        <a class="secondary" id="download-orbit" href="#"><span>Download Orbit</span><b>↓</b></a>
      </div>
      <div class="status" id="status"></div>
      <button class="copy" id="copy-link" type="button">Copy this continuation link</button>
      <p class="fine">Your recruiting goal is attached to this handoff. Orbit will not ask you to type it again after the app opens.</p>
    </div>
  </section>
</main>
<script src="continue.js?v=20260929-1" defer></script>
</body>
</html>
